<!doctype html>
<!-- Source for public/og.png (1200x630). Regenerate with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
       --window-size=1200,630 --screenshot=public/og.png tools/og.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;700&family=IBM+Plex+Serif:ital@1&display=swap">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #17181C; color: #F1F3F6; font-family: 'IBM Plex Sans', sans-serif; position: relative; }
  .copy { position: absolute; left: 72px; top: 84px; width: 600px; }
  .mark { font-weight: 700; font-size: 26px; letter-spacing: 0.08em; text-transform: uppercase; }
  h1, p { text-wrap: balance; }
  h1 { margin-top: 104px; font-weight: 700; font-size: 54px; line-height: 1.12; letter-spacing: -0.01em; }
  p { margin-top: 36px; font-family: 'IBM Plex Serif', serif; font-style: italic; font-size: 26px; line-height: 1.45; color: #B9BCC4; }
  .stack { position: absolute; right: 84px; top: 120px; width: 360px; height: 400px; }
  .page { position: absolute; width: 300px; height: 360px; border-radius: 10px; }
  .p3 { right: 0; top: 0; background: #2A2D35; transform: rotate(5deg); }
  .p2 { right: 24px; top: 14px; background: #3A3E48; transform: rotate(2deg); }
  .p1 { right: 52px; top: 30px; background: #FAF8F3; color: #17181C; padding: 34px 32px; }
  .code { font-size: 15px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #FF7C48; }
  .title { margin-top: 18px; font-size: 25px; font-weight: 700; line-height: 1.2; }
  .lines { margin-top: 26px; }
  .lines span { display: block; height: 9px; border-radius: 5px; background: #DEDAD1; margin-bottom: 14px; }
  .folder { position: absolute; left: -10px; right: -10px; bottom: -20px; height: 150px; background: #16347F; border-radius: 12px; }
  .folder::before { content: ''; position: absolute; left: 0; top: -22px; width: 130px; height: 34px; background: #16347F; border-radius: 10px 10px 0 0; }
</style>
</head>
<body>
  <div class="copy">
    <div class="mark">Pipeline Memo</div>
    <h1>What’s actually happening inside B2B buying decisions.</h1>
    <p>Company deep dives and essays for the people who own pipeline.</p>
  </div>
  <div class="stack">
    <div class="page p3"></div>
    <div class="page p2"></div>
    <div class="page p1">
      <div class="code">Memo</div>
      <div class="title">Where pipeline breaks, and why</div>
      <div class="lines"><span style="width:100%"></span><span style="width:92%"></span><span style="width:96%"></span><span style="width:70%"></span></div>
    </div>
    <div class="folder"></div>
  </div>
</body>
</html>
