<!doctype html>
<!-- Source for public/og.png (1200x630). Regenerate from the repo root with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --force-device-scale-factor=1 --window-size=1200,630 --screenshot=public/og.png "file://$PWD/tools/og.html" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@700&family=Newsreader:ital,opsz,wght@1,6..72,500&display=swap">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #141414; color: #F2EEE6; font-family: 'IBM Plex Sans', sans-serif; position: relative; }
  .copy { position: absolute; left: 80px; top: 76px; width: 640px; }
  .mark { display: block; width: 250px; }
  h1 { margin-top: 92px; font-weight: 700; font-size: 58px; line-height: 1.1; letter-spacing: -0.02em; text-wrap: balance; }
  p { margin-top: 30px; font-family: 'Newsreader', serif; font-style: italic; font-weight: 500; font-size: 30px; line-height: 1.4; color: rgba(242, 238, 230, 0.78); text-wrap: balance; }
  .symbol { position: absolute; right: 64px; top: 165px; width: 320px; }
</style>
</head>
<body>
  <div class="copy">
    <img class="mark" src="../public/brand/buyline-wordmark-on-dark.svg" alt="Buyline">
    <h1>What’s actually happening inside B2B buying decisions.</h1>
    <p>Company deep dives and essays for the people who make the calls.</p>
  </div>
  <img class="symbol" src="../public/brand/buyline-symbol-on-dark.svg" alt="">
</body>
</html>
